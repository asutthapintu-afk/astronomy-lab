<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 34%22%3E%3Ccircle cx=%2217%22 cy=%2217%22 r=%2215%22 fill=%22%230a1022%22 stroke=%22%237dd3fc%22 stroke-width=%222%22/%3E%3Ccircle cx=%2217%22 cy=%2217%22 r=%225%22 fill=%22%23ffcc4d%22/%3E%3Ccircle cx=%2228%22 cy=%2212%22 r=%222.5%22 fill=%22%23e9edf8%22/%3E%3C/svg%3E">
<title>ห้องปฏิบัติการดาราศาสตร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm night-observatory workbench — precise, instructive, quiet
   IDEA: the observing logbook beside a planetarium console: instrument on top, notes below
   PICTURE: each lab's live simulator fills the stage; the home screen shows the lab map as a star field
   COLOUR and TYPE: deep night ink #0a1022, starlight #e9edf8, sky-cyan accent #7dd3fc, Sun gold only for the Sun; Chakra Petch + IBM Plex Sans Thai
   LAYOUT: sidebar of labs, stage + control column, tabs for theory / worksheet / report */
:root{color-scheme:dark;--bg:#0a1022;--bg2:#0e1530;--panel:#131c38;--panel2:#18234a;--line:#263259;--ink:#e9edf8;--muted:#9aa7c7;--acc:#7dd3fc;--acc2:#a5b4fc;--sun:#ffcc4d;--good:#6ee7b7;--bad:#ff8f80;--r:12px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.brand,.btn,.tab{font-family:"Chakra Petch","IBM Plex Sans Thai",sans-serif}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:19px;line-height:1.2;margin:0 6px 16px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand small{display:block;font:500 12.5px "IBM Plex Sans Thai";color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35;min-height:44px}
.nav a:hover{background:var(--panel)}
.nav a.on{background:var(--panel2);box-shadow:inset 0 0 0 1px #34427a}
.nav .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 13px "Chakra Petch";background:#1d2850;color:var(--acc)}
.nav a.on .n{background:var(--acc);color:#06122a}
.nav .grp{font-size:12.5px;color:var(--muted);margin:14px 10px 4px}
main{padding:22px clamp(14px,2.4vw,32px) 60px;max-width:1500px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.head h1{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:2px 0 0;text-wrap:balance}
.kick{color:var(--acc);font:600 14px "Chakra Petch"}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:3px 9px;border-radius:99px;background:#1b2550;color:#c7d2fe;white-space:nowrap}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.stage{display:flex;flex-direction:column;gap:12px}
.fig{position:relative;background:#060b1a;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig canvas{display:block;width:100%;touch-action:none}
.fig .cap{position:absolute;left:10px;top:8px;font-size:13px;color:var(--muted);pointer-events:none}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ctrls{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
.ctrls h3{margin:0;font-size:15px;color:var(--acc2);font-weight:600}
.row{display:flex;flex-direction:column;gap:4px}
.row label{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.row label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
select,input[type=number],input[type=text],input[type=date],input[type=time],textarea{background:#0b1230;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;width:100%}
textarea{min-height:76px;resize:vertical;line-height:1.5}
select:focus,input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid #34427a;background:#1b2550;border-radius:9px;padding:8px 13px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:#25316a}
.btn.pri{background:var(--acc);color:#06122a;border-color:var(--acc)}
.btn.on{background:var(--acc2);color:#0b1022;border-color:var(--acc2)}
.out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:3px 12px;font-size:14px;background:#0b1230;border-radius:9px;padding:10px 12px}
.out span{color:var(--muted)}
.out b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;max-width:210px}
.note{font-size:13.5px;color:var(--muted);line-height:1.5}
.tabs{display:flex;gap:4px;margin:20px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;min-height:44px}
.tab.on{color:var(--ink);border-color:var(--acc)}
.pane{padding:18px 2px;max-width:900px}
.pane h3{font-size:18px;margin:18px 0 6px}
.pane p,.pane li{max-width:72ch}
.eq{font-family:"Chakra Petch";background:#0b1230;border-left:3px solid var(--acc);padding:8px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:16.5px;overflow-x:auto}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.q p{margin:0 0 8px}
.q .qn{color:var(--acc);font:700 14px "Chakra Petch";margin-right:6px}
table.dt{border-collapse:collapse;width:100%;font-size:14px}
table.dt th,table.dt td{border:1px solid var(--line);padding:4px}
table.dt th{background:#18234a;font-weight:600;padding:6px}
table.dt input{border:0;background:transparent;padding:6px;font-size:15px;width:100%}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shot{position:relative;width:200px}
.shot img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.shot button{position:absolute;right:6px;top:6px;min-height:28px;padding:2px 8px;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);color:#06122a;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.home-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:22px}
.home-hero h1{font-size:clamp(30px,4vw,48px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.home-hero p{color:#c8d1ea;font-size:17px;max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-height:96px}
.card:hover{border-color:var(--acc)}
.card .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px "Chakra Petch";background:#1d2850;color:var(--acc)}
.card b{display:block;font-family:"Chakra Petch";font-size:16.5px;line-height:1.25}
.card span{font-size:13.5px;color:var(--muted);line-height:1.45;display:block;margin-top:3px}
.weeks{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
.weeks th,.weeks td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.weeks th{color:var(--muted);font-weight:500}
.menu{display:none}
@media(max-width:1100px){.lab{grid-template-columns:minmax(0,1fr)}.ctrls{position:static}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{margin:0 0 8px}
 .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
 .nav a{flex:none;white-space:nowrap}
 .nav .grp{display:none}
 .home-hero{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:600px){.nav a .t{display:none}.nav a.on .t{display:inline}.ctrls{padding:12px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#7dd3fc" stroke-width="1.5"/><ellipse cx="17" cy="17" rx="15" ry="6" fill="none" stroke="#a5b4fc" stroke-width="1.2" transform="rotate(-25 17 17)"/><circle cx="17" cy="17" r="4.5" fill="#ffcc4d"/><circle cx="29" cy="12" r="2.2" fill="#e9edf8"/></svg>
      <span>ห้องปฏิบัติการดาราศาสตร์<small>Virtual Astronomy Lab · มรม.</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="data/sky.js"></script>
<script src="js/core.js"></script>
<script src="js/astro.js"></script>

<script src="js/labs/l01-models.js"></script>
<script src="js/labs/l02-kepler.js"></script>

<script src="js/labs/l05-sun.js"></script>

<script src="js/labs/l07-chart.js"></script>
<script src="js/labs/l08-scope.js"></script>
<script src="js/labs/l09-hr.js"></script>

</body>
</html>
